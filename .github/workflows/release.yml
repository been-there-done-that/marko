# Builds Marko for Linux, macOS and Windows when a version tag (v1.2.3) is pushed, and attaches
# the archives to a GitHub release. install.sh and install.ps1 download these archives.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: marko-linux-x86_64.tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: marko-linux-aarch64.tar.gz }
          - { os: macos-14, target: aarch64-apple-darwin, asset: marko-macos-aarch64.tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, asset: marko-macos-x86_64.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: marko-windows-x86_64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          d=marko
          mkdir -p $d/icons
          cp target/${{ matrix.target }}/release/marko $d/
          cp packaging/linux/marko.desktop $d/
          cp packaging/icons/png/*.png packaging/icons/marko.png $d/icons/
          cp README.md LICENSE $d/ 2>/dev/null || true
          tar czf ${{ matrix.asset }} $d
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=Marko.app/Contents
          mkdir -p $app/MacOS $app/Resources
          cp target/${{ matrix.target }}/release/marko $app/MacOS/
          cp packaging/icons/marko.icns $app/Resources/
          sed "s/VERSION/${version}/g" packaging/macos/Info.plist > $app/Info.plist
          codesign --force --deep --sign - Marko.app
          tar czf ${{ matrix.asset }} Marko.app
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory marko | Out-Null
          Copy-Item target/${{ matrix.target }}/release/marko.exe marko/
          Copy-Item packaging/icons/marko.ico marko/
          Compress-Archive -Path marko/* -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum marko-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            marko-*
            SHA256SUMS
          generate_release_notes: true
