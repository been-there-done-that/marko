[package]
name = "marko"
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
description = "A fast, light Markdown viewer and editor"
license = "MIT"
repository = "https://github.com/been-there-done-that/marko"

[dependencies]
rune = { git = "https://github.com/been-there-done-that/rune", rev = "71e1b792bc02c0491853a76af03bef29236e0663", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/been-there-done-that/rune", rev = "71e1b792bc02c0491853a76af03bef29236e0663", features = ["markdown", "mermaid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
flate2 = "1"
sha2 = "0.10"
roxmltree = "0.20"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
libc = "0.2"
procwatch = { git = "https://github.com/been-there-done-that/rune", rev = "71e1b792bc02c0491853a76af03bef29236e0663" }

[target.'cfg(unix)'.dependencies]
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
